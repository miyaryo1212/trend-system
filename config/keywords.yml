channels:
  claude-anthropic:
    name: "Claude / Anthropic"
    schedule: "06:00"
    frequency: daily
    pipeline: two-stage

    # Step 0: 公式ソース
    official_sources:
      - name: "Anthropic Sitemap"
        type: sitemap
        urls:
          - "https://www.anthropic.com/sitemap.xml"
        exclude_patterns: "careers|events|unsubscribe|supported-countries|candidate-|interviewer"
      - name: "Claude Code Releases"
        type: rss
        url: "https://github.com/anthropics/claude-code/releases.atom"

    # Step 1: 新機能名抽出 (claude -p で処理、コスト$0)
    feature_extraction:
      prompt: |
        以下のデータから、直近48時間以内に発表された
        Anthropic / Claude関連の新機能・アップデート名を箇条書きで抽出してください。
        対象: Claude Code, Claude Cowork, Claude Security, Claude API, Claude.ai,
        その他Anthropicが発表した新プロダクト・機能すべて。
        機能の説明は1行以内で簡潔に。どのプロダクトかも明記すること。
        該当なしの場合は「なし」とだけ出力。
        出力形式: "- [プロダクト名] 機能名: 簡潔な説明" の箇条書きのみ。前置きや補足は不要。

    # Step 2: 機能ごとにX検索 (Grok x_search)
    x_search:
      base_query: "Claude AI OR Anthropic"
      prompt_template: |
        {{FEATURE_NAME}}（{{FEATURE_DESCRIPTION}}）に関連して、直近1週間にX(Twitter)で話題の個人ユーザー投稿を探してください。
        検索方針:
        - Claude / Claude Code / Anthropic を軸に広く検索し、上記トピックに関連する投稿を優先的に拾う（完全一致は不要。同義語・略称・英語表記も可）
        - 個人ユーザーの実体験・感想を優先。公式アカウント(@claudeai, @AnthropicAI)、企業宣伝・アフィリエイト・「稼げる」系の釣り、SEO/マーケ系の一般論アカウントは除外
        - いいね・リポストの多い投稿を優先（数値でハードに絞り込まない）
        - 期間: 過去7日間 / 言語: 日本語と英語
        分類して出力（最大5件 / 該当が無ければ「該当なし」）:
        1. ポジティブ — 実際に使って便利だった点
        2. ネガティブ — 不具合・制限・不満
        3. Tips — セットアップ方法・活用例
        各投稿は「要旨(1〜2文) — @ユーザー名 [投稿URL]」の形式

    # 補完: コミュニティRSS
    community_sources:
      - name: "Zenn (Claude Code)"
        type: rss
        url: "https://zenn.dev/topics/claudecode/feed"
      - name: "Zenn (Claude)"
        type: rss
        url: "https://zenn.dev/topics/claude/feed"
      - name: "Zenn (Anthropic)"
        type: rss
        url: "https://zenn.dev/topics/anthropic/feed"
      - name: "Qiita (Claude Code)"
        type: rss
        url: "https://qiita.com/tags/ClaudeCode/feed"
      - name: "Qiita (Claude)"
        type: rss
        url: "https://qiita.com/tags/Claude/feed"

  codex-openai:
    name: "Codex / OpenAI"
    schedule: "06:30"
    frequency: daily
    pipeline: two-stage

    official_sources:
      - name: "OpenAI Sitemap"
        type: sitemap
        urls:
          - "https://openai.com/sitemap.xml/product/"
          - "https://openai.com/sitemap.xml/release/"
          - "https://openai.com/sitemap.xml/research/"
          - "https://openai.com/sitemap.xml/engineering/"
        exclude_patterns: ""
      - name: "Codex CLI Releases"
        type: rss
        url: "https://github.com/openai/codex/releases.atom"

    feature_extraction:
      prompt: |
        以下のデータから、直近48時間以内に発表された
        OpenAI / Codexの新機能・アップデート名を箇条書きで抽出してください。
        機能の説明は1行以内で簡潔に。該当なしの場合は「なし」とだけ出力。
        出力形式: "- 機能名: 簡潔な説明" の箇条書きのみ。前置きや補足は不要。

    x_search:
      base_query: "Codex CLI OR OpenAI"
      prompt_template: |
        {{FEATURE_NAME}}（{{FEATURE_DESCRIPTION}}）に関連して、直近1週間にX(Twitter)で話題の個人ユーザー投稿を探してください。
        検索方針:
        - Codex / Codex CLI / OpenAI / ChatGPT を軸に広く検索し、上記トピックに関連する投稿を優先的に拾う（完全一致は不要。同義語・略称・英語表記も可）
        - 個人ユーザーの実体験・感想を優先。公式アカウント(@OpenAI, @OpenAIDevs)、企業宣伝・アフィリエイト・「稼げる」系の釣り、SEO/マーケ系の一般論アカウントは除外
        - いいね・リポストの多い投稿を優先（数値でハードに絞り込まない）
        - 期間: 過去7日間 / 言語: 日本語と英語
        分類して出力（最大5件 / 該当が無ければ「該当なし」）:
        1. ポジティブ — 実際に使って便利だった点
        2. ネガティブ — 不具合・制限・不満
        3. Tips — セットアップ方法・活用例
        各投稿は「要旨(1〜2文) — @ユーザー名 [投稿URL]」の形式

    community_sources:
      - name: "Zenn"
        type: rss
        url: "https://zenn.dev/topics/openai/feed"
      - name: "Qiita"
        type: rss
        url: "https://qiita.com/tags/OpenAI/feed"

  ai-trends:
    name: "生成AIトレンド総合"
    schedule: "07:00"
    frequency: daily
    pipeline: two-stage

    official_sources:
      - name: "Anthropic Sitemap"
        type: sitemap
        urls:
          - "https://www.anthropic.com/sitemap.xml"
        exclude_patterns: "careers|events|unsubscribe|supported-countries|candidate-|interviewer"
      - name: "OpenAI Sitemap"
        type: sitemap
        urls:
          - "https://openai.com/sitemap.xml/product/"
          - "https://openai.com/sitemap.xml/release/"
          - "https://openai.com/sitemap.xml/research/"
        exclude_patterns: ""

    # CH3ではfeature_extractionの粒度を「話題・トピック」に変更
    feature_extraction:
      prompt: |
        以下のデータから、直近48時間以内に話題になった
        生成AI関連の主要なトピック・ニュースを箇条書きで抽出してください。
        各項目は1行以内で簡潔に。該当なしの場合は「なし」とだけ出力。
        出力形式: "- トピック名: 簡潔な説明" の箇条書きのみ。前置きや補足は不要。

    x_search:
      base_query: "生成AI OR LLM"
      prompt_template: |
        {{FEATURE_NAME}}（{{FEATURE_DESCRIPTION}}）に関連して、直近1週間にX(Twitter)で話題の個人ユーザー投稿を探してください。
        検索方針:
        - このトピックの製品名・モデル名・サービス名を軸に広く検索する（完全一致は不要。同義語・略称・英語表記も可）。生成AI/LLM全般の文脈で拾う
        - 個人ユーザーの実体験・感想を優先。企業宣伝・アフィリエイト・「稼げる」系の釣り、SEO/マーケ系の一般論アカウントは除外
        - いいね・リポストの多い投稿を優先（数値でハードに絞り込まない）
        - 期間: 過去7日間 / 言語: 日本語
        分類して出力（最大5件 / 該当が無ければ「該当なし」）:
        1. ポジティブ — 実際に使って便利だった点
        2. ネガティブ — 不具合・制限・不満
        3. Tips — セットアップ方法・活用例
        各投稿は「要旨(1〜2文) — @ユーザー名 [投稿URL]」の形式

    community_sources:
      - name: "Zenn トレンド"
        type: rss
        url: "https://zenn.dev/feed"
      - name: "Qiita トレンド"
        type: rss
        url: "https://qiita.com/popular-items/feed.atom"

  github-trending:
    name: "GitHub急成長リポ"
    schedule: "08:00"
    frequency: weekly_monday
    pipeline: two-stage

    official_sources:
      - name: "GitHub Trending 全言語"
        type: rss
        url: "https://mshibanami.github.io/GitHubTrendingRSS/daily/all.xml"
      - name: "GitHub Trending Python"
        type: rss
        url: "https://mshibanami.github.io/GitHubTrendingRSS/daily/python.xml"
      - name: "GitHub Trending TypeScript"
        type: rss
        url: "https://mshibanami.github.io/GitHubTrendingRSS/daily/typescript.xml"

    feature_extraction:
      prompt: |
        以下のGitHub Trendingデータから、AI/LLM関連で注目すべき
        リポジトリを箇条書きで抽出してください。
        各項目はリポ名と概要を1行以内で。該当なしの場合は「なし」とだけ出力。
        出力形式: "- owner/repo: 簡潔な説明" の箇条書きのみ。

    x_search:
      base_query: "GitHub"
      prompt_template: |
        {{FEATURE_NAME}}（{{FEATURE_DESCRIPTION}}）に関連して、直近1週間にX(Twitter)で話題の投稿を探してください。
        検索方針:
        - 該当リポジトリ/プロジェクト名を軸に GitHub 文脈で広く検索する（完全一致は不要。同義語・略称・英語表記も可）
        - 実際に使った人の感想・評価を優先。アフィリエイト・宣伝・「稼げる」系の釣り、SEO/マーケ系の一般論アカウントは除外
        - いいね・リポストの多い投稿を優先（数値でハードに絞り込まない）
        - 期間: 過去7日間 / 言語: 日本語・英語
        分類して出力（最大5件 / 該当が無ければ「該当なし」）:
        1. 注目ポイント — なぜ伸びているか
        2. 実際の使用例 — 使ってみた報告
        3. 批評 — 懸念・限界・代替
        各投稿は「要旨(1〜2文) — @ユーザー名 [投稿URL]」の形式

    community_sources: []

  academia:
    name: "LLM/NLP最新論文"
    schedule: "07:30"
    frequency: daily
    pipeline: two-stage

    official_sources:
      - name: "Hugging Face Daily Papers"
        type: json_api
        url: "https://huggingface.co/api/daily_papers"
      - name: "arXiv cs.CL (計算言語学)"
        type: rss
        url: "https://export.arxiv.org/rss/cs.CL"
      - name: "arXiv cs.AI (人工知能)"
        type: rss
        url: "https://export.arxiv.org/rss/cs.AI"
      - name: "arXiv cs.LG (機械学習)"
        type: rss
        url: "https://export.arxiv.org/rss/cs.LG"

    feature_extraction:
      prompt: |
        以下のデータから、直近24時間以内に公開された
        LLM・NLP・機械学習/深層学習に関する注目論文を箇条書きで抽出してください。
        対象分野: 大規模言語モデル、自然言語処理、機械学習、深層学習、
        およびこれらの応用（コード生成、マルチモーダル、強化学習、アライメント等）。
        選定基準: 新規性、影響度、実用性の高いものを優先（最大10件）。
        Hugging Face Daily Papersで上位にある論文は優先的に含めること。
        該当なしの場合は「なし」とだけ出力。
        出力形式: "- 論文タイトル: 一行の概要説明" の箇条書きのみ。前置きや補足は不要。

    x_search:
      enabled: false

    community_sources: []
